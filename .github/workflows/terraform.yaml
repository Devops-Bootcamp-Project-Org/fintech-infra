permissions:
  id-token: write # Required for OIDC authentication
  contents: read  # Required for actions/checkout

name: Terraform-AWS-Infra-Deployment
on:
  push:
    branches:
      - release   
  pull_request:
    branches:
      - main 
      - release
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment (dev, qa, uat, prod)"
        required: true
        default: "prod"
      region:
        description: "AWS Region"
        required: true
        default: "us-east-2"
      action:
        description: "Terraform action: apply (default) or destroy"
        required: false
        default: "apply"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ##################################################
  # 1. CLEANUP: Remove orphaned resources blocking TF
  ##################################################
  cleanup:
    name: Infrastructure Cleanup
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ github.event.inputs.region || 'us-east-2' }}
    steps:
      - name: Manual Cleanup of Orphaned Resources
        run: |
          echo "Cleaning up IAM Roles..."
          aws iam detach-role-policy --role-name eks-client-ssm-role --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore || true
          aws iam detach-role-policy --role-name github-runner-ssm-role --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore || true
          aws iam delete-role --role-name eks-client-ssm-role || true
          aws iam delete-role --role-name github-runner-ssm-role || true
          
          echo "Cleaning up IAM Policies..."
          aws iam delete-policy --policy-arn arn:aws:iam::805703880776:policy/prod-GitHubECRPolicy || true
          aws iam delete-policy --policy-arn arn:aws:iam::805703880776:policy/prod-GitHubEKSPolicy || true
          
          echo "Cleaning up CloudWatch Logs..."
          aws logs delete-log-group --log-group-name "/aws/eks/prod-fintek-cluster/cluster" --region ${{ env.AWS_DEFAULT_REGION }} || true

  ##################################################
  # 2. PLAN: Generate the execution plan
  ##################################################
  plan:
    name: Terraform Plan
    needs: cleanup
    runs-on: ubuntu-latest
    env:
      TF_ENV: ${{ github.event.inputs.environment || 'prod' }}
      AWS_REGION: ${{ github.event.inputs.region || 'us-east-2' }}
      TF_DIR: ${{ github.event.inputs.environment || 'prod' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"
          terraform_wrapper: false 

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade -backend-config="key=${{ env.TF_ENV }}/terraform.tfstate"

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -lock=false

  ##################################################
  # 3. APPROVE: Manual Gate
  ##################################################
  approve:
    name: Await Approval
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - run: echo "✅ Approval granted for ${{ github.event.inputs.environment || 'prod' }}."

  ##################################################
  # 4. DEPLOY: Run Apply or Destroy
  ##################################################
  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: approve
    env:
      TF_ENV: ${{ github.event.inputs.environment || 'prod' }}
      AWS_REGION: ${{ github.event.inputs.region || 'us-east-2' }}
      TF_DIR: ${{ github.event.inputs.environment || 'prod' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="key=${{ env.TF_ENV }}/terraform.tfstate"

      - name: Terraform Apply
        if: ${{ github.event.inputs.action != 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -lock=false

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -lock=false